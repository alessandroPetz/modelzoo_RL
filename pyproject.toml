[project]
name = "seanergys-modelzoo"
version = "0.1.0"
description = ""
authors = [
    {name = "Mohsen Seyedkazemi Ardebili",email = "mohsen.seyedkazemi@unibo.it"}
]
readme = "README.md"
# Capped at <3.15: torch/triton require Python <3.15 (as of 2025)
requires-python = ">=3.12,<3.15"
dependencies = [
    "requests>=2.33.1,<3.0.0",
    "pydantic>=2.0.0,<3.0.0",
    "torch>=2.0.0,<3.0.0",
    "urllib3>=2.7.0",
]


[tool.mypy]
plugins = ["pydantic.mypy"]
ignore_missing_imports = true

[tool.pytest.ini_options]
markers = [
    "zenodo: tests that download from Zenodo (require network)",
]

[tool.coverage.run]
source = ["seanergys_modelzoo"]
# relative_files lets `coverage combine` merge data files produced by separate CI
# jobs, and makes the cobertura paths repo-relative so GitLab maps them to the diff.
relative_files = true

[tool.coverage.paths]
# Treat the source tree and any installed copy as the same files when combining.
source = ["seanergys_modelzoo", "*/seanergys_modelzoo"]

[tool.coverage.report]
show_missing = true

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest>=9.0.3,<10.0.0",
    "pytest-cov>=7.1.0,<8.0.0",
    "black>=26.3.1,<27.0.0",
    "ruff>=0.15.12,<0.16.0",
    "pydantic>=2.13.3,<3.0.0",
    "pygments>=2.20.0,<3.0.0",
    "pyyaml>=6.0.2,<7.0.0",
]
ci = [
    "pydantic>=2.13.3,<3.0.0",
    "numpy>=2.4.4,<3.0.0",
    "pandas>=3.0.2,<4.0.0",
    "scikit-learn>=1.8.0,<2.0.0",
    "joblib>=1.5.3,<2.0.0",
    "xgboost>=3.2.0,<4.0.0",
    "torch>=2.11.0,<3.0.0",
    "sentence-transformers>=5.4.1,<6.0.0",
    "pyarrow>=24.0.0,<25.0.0",
    "cachetools>=7.1.4,<8.0.0",
    # fsspec + aiohttp back the memory-safe remote read in FDataDataset._read_parquet:
    # fsspec opens the Zenodo URL with HTTP range requests so the capped is_dummy read
    # fetches only the selected columns' chunks (~136 MB), not the whole file. fsspec's
    # HTTPFileSystem requires aiohttp; without it the read raises ImportError.
    "fsspec>=2026.4.0",
    "aiohttp>=3.14.3,<4.0.0",
]
